<body data-screen="admin_login" class="bg-surface text-on-surface font-body antialiased">
  <div class="min-h-[1024px] flex flex-col items-center justify-center px-page-margin" data-stitch-vh="min-h-[1024px]===min-h-screen">
    <div class="max-w-md w-full border border-hairline bg-surface-alt p-10 rounded-sm">
      <div class="pb-6 border-b border-hairline mb-8">
        <p class="font-mono text-mono-sm text-muted uppercase mb-2">WATCH HEAVEN · OPERATIONS</p>
        <h1 class="font-headline text-headline-md-mobile md:text-headline-md text-on-surface">Administrator sign in</h1>
      </div>

      <form class="flex flex-col gap-5">
        <label class="flex flex-col gap-2">
          <span class="font-label text-label-md text-on-surface">Admin email</span>
          <input type="email" placeholder="admin@watchheaven.eg" class="w-full bg-surface-input border border-hairline rounded-sm px-3.5 py-3 font-body text-body-md focus:border-primary focus:ring-0">
        </label>

        <label class="flex flex-col gap-2">
          <span class="font-label text-label-md text-on-surface">Password</span>
          <input type="password" placeholder="Enter administrator password" class="w-full bg-surface-input border border-hairline rounded-sm px-3.5 py-3 font-body text-body-md focus:border-primary focus:ring-0">
        </label>

        <button type="submit" class="w-full bg-primary text-on-primary py-3.5 rounded-sm font-label text-label-lg hover:bg-aged-brass transition-colors mt-2">Sign in</button>
      </form>

      <p class="font-mono text-mono-sm text-muted mt-6 text-center">Restricted to authorized store personnel.</p>
    </div>
  </div>
